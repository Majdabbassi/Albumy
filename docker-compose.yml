version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: albumy-postgres
    environment:
      POSTGRES_DB: albumy
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: azerty
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
