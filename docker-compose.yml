services:
  # ---------------------------------------------------------------- MySQL
  # Management/db ports (mysql, redis, phpmyadmin) are loopback-only; the app
  # surface (backend :8080, frontend :8081) stays on 0.0.0.0 for LAN/phone testing.
  mysql:
    image: mysql:8.4
    container_name: albumy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-albumy_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-albumy}
      MYSQL_USER: ${MYSQL_USER:-albumy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-albumy}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: albumy-redis
    restart: unless-stopped
    # Loopback-only: no plaintext Redis on the LAN. App containers reach it over the
    # internal compose network; the dev-default password stops anything that can still
    # connect from enqueuing fake media jobs or deleting upload sessions.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-albumy_redis}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-albumy_redis}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------- Backend
  backend:
    build:
      context: ./albumy_backend
    container_name: albumy-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/albumy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-albumy}
      DB_PASSWORD: ${MYSQL_PASSWORD:-albumy}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-albumy_redis}
      JWT_SECRET: ${JWT_SECRET:?Set_JWT_SECRET_in_your_.env_file_(see_.env.example)}
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
    ports:
      - "8080:8080"
    volumes:
      - albumy_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Media worker: same jar, worker profile (web off), consumes the ffmpeg/ImageIO job queue.
  worker:
    build:
      context: ./albumy_backend
    container_name: albumy-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/albumy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-albumy}
      DB_PASSWORD: ${MYSQL_PASSWORD:-albumy}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-albumy_redis}
      UPLOAD_DIR: /app/uploads
      SPRING_PROFILES_ACTIVE: worker
      MEDIA_JOBS_THREADS: ${MEDIA_JOBS_THREADS:-2}
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
    volumes:
      - albumy_uploads:/app/uploads

  # ------------------------------------------------------------ Frontend
  frontend:
    build:
      context: ./albumy_frontend
    container_name: albumy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

  # ---------------------------------------------------------- phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: albumy-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-albumy}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-albumy}
      UPLOAD_LIMIT: 100M
    ports:
      - "127.0.0.1:8082:80"

volumes:
  mysql-data:
  albumy_uploads:
  redis-data: