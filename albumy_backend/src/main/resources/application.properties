spring.application.name=albumy

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/albumy}
spring.datasource.username=${DB_USER:albumy}
spring.datasource.password=${DB_PASSWORD:albumy}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

upload.dir=${UPLOAD_DIR:uploads}

jwt.secret=${JWT_SECRET:albumy-dev-only-secret-change-me-in-production}
jwt.expiration=86400000

# Frontend base URL used when building invite registration links
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# How long an invite link stays valid (in days)
invite.expiration.days=7

server.port=8080

# Limit uploads: 25MB per file, request cap covers multi-file uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=110MB