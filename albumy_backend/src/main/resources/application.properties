spring.application.name=albumy

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/albumy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:albumy}
spring.datasource.password=${DB_PASSWORD:albumy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis: pub/sub + upload sessions + media job queue + presence
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

upload.dir=${UPLOAD_DIR:uploads}

# JWT signing key. The fallback is a publicly-known placeholder: JwtSecretGuard refuses
# to boot with it, so a real JWT_SECRET must be supplied (e.g. `openssl rand -hex 32`).
jwt.secret=${JWT_SECRET:albumy-dev-only-secret-change-me-in-production}
jwt.expiration=86400000

# Frontend base URL used when building invite registration links
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Comma-separated list of allowed CORS origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost,http://localhost:8081,https://localhost,capacitor://localhost}

# How long an invite link stays valid (in days)
invite.expiration.days=7

server.port=${PORT:8080}
# Trust X-Forwarded-For/X-Forwarded-Proto only from the configured reverse proxy.
server.forward-headers-strategy=native

# Chunked uploads: uploads arrive as 5MB chunks; the assembled file may be up to 2GB.
upload.chunk.size=${UPLOAD_CHUNK_SIZE:5242880}
upload.max.file=${UPLOAD_MAX_FILE:2147483648}
upload.session.ttl.hours=24

# Media pipeline (worker consumes jobs from Redis, writes derivatives to the upload dir).
media.queue=media:jobs
media.jobs.threads=${MEDIA_JOBS_THREADS:2}
media.jobs.queue=${MEDIA_JOBS_QUEUE:16}
media.jobs.recover.minutes=${MEDIA_JOBS_RECOVER_MINUTES:30}
media.image.sizes=320,960,1920

# Spring Boot legacy multipart kept for the classic single-request upload path.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=110MB

# Health endpoint only (keeps the compose healthchecks lightweight).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Public-surface rate limiting (sliding window per client IP; login is also
# keyed by username so a distributed attempt can't hammer one account).
# Set app.rate-limit.enabled=false to disable.
app.rate-limit.enabled=true
app.rate-limit.window-minutes=15
app.rate-limit.login-per-ip=20
app.rate-limit.login-per-username=10
app.rate-limit.register-per-ip=20
app.rate-limit.event-info-per-ip=200
app.rate-limit.name-available-per-ip=60
app.rate-limit.claim-per-ip=30
app.rate-limit.upload-init-per-ip=100
app.rate-limit.upload-complete-per-ip=150

# Guest/full-album realtime tickets: HMAC-signed with the JWT secret, bound to an
# event, valid 24h. STOMP subscriptions to /topic/events/{id}/* require either a
# matching ticket (guests) or the event organizer's/admin's JWT (see SecurityConfig).
app.realtime.ticket-ttl-ms=86400000